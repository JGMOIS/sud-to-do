<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --red:#C0281C;--red-dark:#a02016;
  --navy:#1A2B4A;--navy-light:#243659;--navy-dark:#0f1c30;
  --bg:#eaecf2;--col-bg:#dfe3ed;--card-bg:#fff;
  --text:#1A2B4A;--muted:#6b7a99;--border:#ccd3e3;
  --green:#1D9E75;--amber:#d4890a;--danger:#C0281C;
  --r:13px;--rsm:9px;
  --font:'DM Sans',system-ui,-apple-system,sans-serif;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;flex-direction:column}

/* LOGIN */
#login-screen{position:fixed;inset:0;background:var(--navy-dark);z-index:999;flex-direction:column;align-items:center;justify-content:center;gap:20px;display:flex}
.login-logo{width:80px;height:80px;border-radius:18px;object-fit:cover}
.login-title{color:#fff;font-size:24px;font-weight:600}
.login-sub{color:rgba(255,255,255,.45);font-size:14px;text-align:center;max-width:280px;line-height:1.5}
.btn-google{background:#fff;color:#1A2B4A;border:none;border-radius:12px;padding:14px 28px;font-size:15px;font-weight:500;cursor:pointer;font-family:var(--font);display:flex;align-items:center;gap:10px;box-shadow:0 2px 12px rgba(0,0,0,.25)}
.btn-google:hover{background:#f0f2f5}
.login-err{color:#f97066;font-size:13px;text-align:center;max-width:280px;display:none}

/* HEADER */
.hdr{background:var(--navy-dark);padding:calc(var(--safe-top) + 10px) 14px 10px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo-img{width:32px;height:32px;border-radius:7px;flex-shrink:0;object-fit:cover}
.hdr-info{flex:1}
.hdr-title{color:#fff;font-size:15px;font-weight:600}
.hdr-sub{color:rgba(255,255,255,.4);font-size:11px}
.hdr-actions{display:flex;gap:7px;align-items:center}
.btn-new{background:var(--red);color:#fff;border:none;border-radius:8px;padding:7px 13px;font-size:13px;font-weight:500;cursor:pointer;font-family:var(--font)}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#888;flex-shrink:0;transition:background .4s}
.sync-dot.ok{background:var(--green)}.sync-dot.err{background:var(--danger)}.sync-dot.loading{background:var(--amber);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* USER BAR */
.user-bar{background:var(--navy);padding:7px 12px;display:flex;align-items:center;gap:8px;flex-shrink:0;border-bottom:2px solid transparent}
.user-bar.viewing-other{border-bottom:2px solid var(--amber)}
.user-tab{background:transparent;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.6);border-radius:20px;padding:4px 12px;font-size:11px;cursor:pointer;font-family:var(--font);white-space:nowrap;display:flex;align-items:center;gap:5px;transition:all .15s}
.user-tab.active{background:var(--red);border-color:var(--red);color:#fff}
.uavatar{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#fff}
.viewing-badge{color:var(--amber);font-size:11px;font-weight:500;display:none}
.user-bar.viewing-other .viewing-badge{display:block}
.btn-logout{background:transparent;border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.4);border-radius:20px;padding:4px 10px;font-size:11px;cursor:pointer;font-family:var(--font);margin-left:auto}
.btn-logout:hover{border-color:rgba(255,255,255,.4);color:rgba(255,255,255,.7)}

/* FILTERS */
.filters{background:var(--navy);padding:7px 12px;display:flex;gap:6px;align-items:center;flex-shrink:0;overflow-x:auto;-webkit-overflow-scrolling:touch;border-top:1px solid rgba(255,255,255,.06)}
.filters::-webkit-scrollbar{display:none}
.flabel{color:rgba(255,255,255,.35);font-size:10px;letter-spacing:.5px;flex-shrink:0}
.fbtn{background:transparent;border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.6);border-radius:20px;padding:4px 11px;font-size:11px;cursor:pointer;font-family:var(--font);white-space:nowrap;flex-shrink:0}
.fbtn.on{background:var(--red);border-color:var(--red);color:#fff}
@media(min-width:641px){.mobile-only{display:none!important}}

/* BOARD */
.board{flex:1;min-height:0;display:flex;gap:10px;padding:10px;overflow-x:auto;overflow-y:hidden;align-items:flex-start;-webkit-overflow-scrolling:touch}
.board::-webkit-scrollbar{height:4px}
.board::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.col{background:var(--col-bg);border-radius:var(--r);min-width:225px;width:225px;flex-shrink:0;display:flex;flex-direction:column;height:100%}
.col-hdr{padding:10px 12px 9px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;border-bottom:1px solid var(--border)}
.col-name{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--muted)}
.col-badge{background:rgba(26,43,74,.12);color:var(--navy);font-size:10px;font-weight:600;border-radius:10px;padding:1px 7px}
.col-body{padding:6px 8px 10px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.col-body::-webkit-scrollbar{width:3px}
.col-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.col-body.over{background:rgba(192,40,28,.08)}
.col-empty{text-align:center;padding:24px 10px;color:var(--muted);font-size:12px;opacity:.7}

/* CARDS */
.card{background:var(--card-bg);border-radius:var(--rsm);border:1px solid var(--border);padding:9px 10px 8px;margin-bottom:6px;cursor:grab;position:relative;transition:box-shadow .15s,transform .12s;user-select:none}
.card:active{cursor:grabbing}
.card:hover{box-shadow:0 3px 12px rgba(26,43,74,.13);transform:translateY(-1px)}
.card.dragging{opacity:.45;transform:scale(.96)}
.card.by-other{border-left:3px solid var(--amber)}
.card-top{display:flex;gap:7px;align-items:flex-start;margin-bottom:5px}
.prio-pip{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:5px}
.p-urgente .prio-pip{background:#E24B4A}
.p-alta .prio-pip{background:#EF9F27}
.p-normal .prio-pip{background:#1D9E75}
.p-baixa .prio-pip, .p-cancelada .prio-pip{background:#aab0c0}
.card-title{font-size:12.5px;font-weight:500;line-height:1.38;flex:1;color:var(--text)}
.card-edit-btn{opacity:0;width:22px;height:22px;background:var(--col-bg);border:none;border-radius:5px;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0}
.card:hover .card-edit-btn{opacity:1}
.card-edit-btn:hover{background:var(--border);color:var(--red)}
.card-foot{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.cat-tag{font-size:10px;font-weight:500;padding:2px 6px;border-radius:5px;background:#eaecf5;color:#4a5a7a}
.date-tag{font-size:10px;color:var(--muted)}
.date-late{color:#E24B4A;font-weight:600;font-size:10px}
.date-soon{color:#d4890a;font-weight:600;font-size:10px}
.card-creator{font-size:9.5px;color:var(--amber);font-weight:500;margin-top:4px}
.card-obs{font-size:10.5px;color:var(--muted);margin-top:5px;padding-top:5px;border-top:1px solid var(--border);font-style:italic;line-height:1.35}
@media(max-width:700px){.card-edit-btn{opacity:1}}

/* CALENDAR PANEL */
.cal-panel{background:#fff;border-radius:var(--r);min-width:360px;width:360px;flex-shrink:0;display:flex;flex-direction:column;height:100%;overflow:hidden;border:1px solid var(--border)}
@media(max-width:640px){.cal-panel{display:none}}
.cal-hdr{padding:9px 12px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;border-bottom:1px solid var(--border);background:var(--col-bg)}
.cal-hdr-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--muted)}
.btn-cal-event{background:var(--red);color:#fff;border:none;border-radius:7px;padding:5px 11px;font-size:11px;font-weight:500;cursor:pointer;font-family:var(--font)}
.cal-iframe-wrap{flex:1;position:relative;overflow:hidden}
.cal-iframe-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:none}

/* MOBILE LIST */
@media(max-width:640px){
  .board{display:none}
  .mobile-list{display:flex;flex-direction:column;gap:6px;padding:8px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
  .mobile-list .card{margin-bottom:0;cursor:pointer}
  .mobile-empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px}
}
@media(min-width:641px){.mobile-list{display:none}}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(10,18,35,.6);z-index:200;display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
@media(min-width:600px){.overlay{align-items:center}.modal{border-radius:16px!important;max-width:420px;margin:auto}}
.modal{background:#fff;width:100%;padding:20px 18px;border-radius:18px 18px 0 0;padding-bottom:calc(var(--safe-bot) + 20px);max-height:92vh;overflow-y:auto}
.modal h3{font-size:16px;font-weight:600;color:var(--navy);margin-bottom:4px}
.modal-sub{font-size:12px;color:var(--amber);font-weight:500;margin-bottom:14px}
.frow{margin-bottom:11px}
.frow label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;font-weight:500}
.frow input,.frow select,.frow textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:9px;font-size:14px;font-family:var(--font);color:var(--text);background:#f8f9fc;outline:none;-webkit-appearance:none}
.frow input:focus,.frow select:focus,.frow textarea:focus{border-color:var(--navy);background:#fff}
.frow input:disabled,.frow select:disabled,.frow textarea:disabled{opacity:.5;cursor:not-allowed}
.frow textarea{resize:vertical;min-height:60px;line-height:1.5}
.readonly-notice{background:#fff8e6;border:1px solid #f0d080;border-radius:9px;padding:10px 12px;font-size:12px;color:#8a6a00;margin-bottom:12px}
.modal-btns{display:flex;gap:8px;margin-top:16px}
.btn-save{flex:1;background:var(--navy);color:#fff;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:500;cursor:pointer;font-family:var(--font)}
.btn-cancel{flex:1;background:var(--col-bg);color:var(--muted);border:none;border-radius:10px;padding:12px;font-size:14px;cursor:pointer;font-family:var(--font)}
.btn-del{background:#fdf0ee;color:var(--red);border:none;border-radius:10px;padding:12px 14px;font-size:13px;cursor:pointer;font-family:var(--font)}

/* EVENT MODAL */
.event-overlay{position:fixed;inset:0;background:rgba(10,18,35,.6);z-index:300;display:none;align-items:center;justify-content:center;padding:20px}
.event-overlay.open{display:flex}
.event-modal{background:#fff;width:100%;max-width:420px;border-radius:16px;padding:22px 20px;max-height:90vh;overflow-y:auto}
.event-modal h3{font-size:16px;font-weight:600;color:var(--navy);margin-bottom:16px}

/* TOAST */
.toast{position:fixed;bottom:calc(var(--safe-bot) + 16px);left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--navy-dark);color:#fff;font-size:12px;padding:8px 16px;border-radius:20px;z-index:500;transition:opacity .25s,transform .25s;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:#0F6E56}.toast.err{background:#a32d2d}
</style>

function dateLabel(ds) {
  if (!ds) return null;
  const d = new Date(ds + 'T00:00:00');
  const now = new Date(); now.setHours(0,0,0,0);
  const diff = Math.round((d - now) / 86400000);
  if (diff < 0)  return {txt: Math.abs(diff) + 'd atraso', cls: 'date-late'};
  if (diff === 0) return {txt: 'Hoje', cls: 'date-soon'};
  if (diff <= 3)  return {txt: diff + 'd', cls: 'date-soon'};
  return {txt: d.getDate().toString().padStart(2,'0') + '/' + (d.getMonth()+1).toString().padStart(2,'0'), cls: 'date-tag'};
}

function toast(msg, type) {

        var sc = {'Em aberto':'#378ADD','Em andamento':'#EF9F27','Concluida':'#1D9E75','Cancelada':'#aab0c0'}[t.status]||'#888';
        var card = document.createElement('div');
        card.className = 'card p-' + (t.prio||'normal').toLowerCase() + (byOther ? ' by-other' : '');
        card.innerHTML =
          '<div class="card-top"><div class="prio-pip"></div><div class="card-title">' + t.title + '</div></div>' +
          '<div class="card-foot"><span class="cat-tag">' + t.cat + '</span>' +
          '<span style="font-size:10px;padding:2px 6px;border-radius:5px;background:' + sc + '22;color:' + sc + ';font-weight:500">' + t.status + '</span>' +
          (dl ? '<span class="' + dl.cls + '">' + dl.txt + '</span>' : '') + '</div>' +
          (byOther ? '<div class="card-creator">Adicionado por ' + (t.createdByName||t.createdBy) + '</div>' : '') +
          (t.obs ? '<div class="card-obs">' + t.obs + '</div>' : '');
        card.addEventListener('click', function() { openModal(t.id); });
        mobileList.appendChild(card);
      });
    }
  }
}

// FIREBASE
async function saveToFirebase(task) {
  setSyncDot('loading');
  try {
    await setDoc(doc(db, 'users', VIEW_UID, 'tasks', task.id), task);
    setSyncDot('ok');
  } catch(e) { setSyncDot('err'); toast('Erro ao guardar', 'err'); }
}

async function deleteFromFirebase(id) {
  setSyncDot('loading');
  try {
    await deleteDoc(doc(db, 'users', VIEW_UID, 'tasks', id));
    setSyncDot('ok');
  } catch(e) { setSyncDot('err'); toast('Erro ao apagar', 'err'); }
}

async function seedIfEmpty(snapshot) {
  // Only seed if board is completely empty AND we are on our own board AND it is j.mois
  if (seeded) return;
  seeded = true;
  if (snapshot.empty && VIEW_UID === ME_UID && ME === 'j.mois@construsud.com') {
    toast('A carregar tarefas iniciais...', '');
    var batch = writeBatch(db);
    SEED.forEach(function(t) { batch.set(doc(db, 'users', ME_UID, 'tasks', t.id), t); });
    await batch.commit();
    toast('Tarefas carregadas!', 'ok');
  }
}

function startListener(targetUid) {
  if (unsubListener) unsubListener();
  setSyncDot('loading');
  tasks = {};
  seeded = false;
  var col = collection(db, 'users', targetUid, 'tasks');
  unsubListener = onSnapshot(col, function(snap) {
    seedIfEmpty(snap);
    tasks = {};
    snap.forEach(function(d) { tasks[d.id] = d.data(); });
    setSyncDot('ok');
    render();
  }, function(err) { setSyncDot('err'); toast('Sem ligacao ao Firebase', 'err'); });
}

async function getOtherUser() {
  if (otherUserCache) return otherUserCache;
  var otherEmail = Object.keys(USER_NAMES).find(function(e) { return e !== ME; });
  if (!otherEmail) return null;
  var q = query(collection(db, 'usermap'), where('email', '==', otherEmail));
  var snap = await getDocs(q);
  if (snap.empty) return null;
  otherUserCache = snap.docs[0].data();
  return otherUserCache;
}

window.switchBoard = async function(who) {
  var userBar = document.getElementById('user-bar');
  if (who === 'me') {
    VIEW_UID = ME_UID; VIEW_EMAIL = ME;
    document.getElementById('tab-me').classList.add('active');
    document.getElementById('tab-other').classList.remove('active');
    userBar.classList.remove('viewing-other');
    document.getElementById('hdr-sub').textContent = 'O meu TO-DO';
  } else {
    var other = await getOtherUser();
    if (!other) { toast('Colega ainda nao entrou na app pela primeira vez', 'err'); return; }
    VIEW_UID = other.uid; VIEW_EMAIL = other.email;
    document.getElementById('tab-me').classList.remove('active');
    document.getElementById('tab-other').classList.add('active');
    userBar.classList.add('viewing-other');
    document.getElementById('hdr-sub').textContent = 'Board de ' + other.name;
  }
  otherUserCache = null;
  startListener(VIEW_UID);
};

// AUTH
window.doLogin = async function() {
  document.getElementById('login-err').style.display = 'none';
  try {
    var result = await signInWithPopup(auth, provider);
    var email = result.user.email;
    if (!email || !email.endsWith('@' + ALLOWED_DOMAIN)) {
      await signOut(auth);
      document.getElementById('login-err').style.display = 'block';
    }
  } catch(e) {
    if (e.code !== 'auth/popup-closed-by-user') {
      toast('Erro ao entrar: ' + e.message, 'err');
    }
  }
};

window.doLogout = async function() {
  if (unsubListener) unsubListener();
  otherUserCache = null;
  await signOut(auth);
};

onAuthStateChanged(auth, async function(user) {
  if (user && user.email && user.email.endsWith('@' + ALLOWED_DOMAIN)) {
    ME     = user.email;
    ME_UID = user.uid;
    var uinfo = USER_NAMES[ME] || {name: user.displayName || user.email, initials: user.email.slice(0,2).toUpperCase()};
    ME_NAME = uinfo.name;
    VIEW_UID = ME_UID; VIEW_EMAIL = ME;

    // Register in usermap — always overwrite to keep fresh
    await setDoc(doc(db, 'usermap', ME_UID), {email: ME, name: ME_NAME, uid: ME_UID});

    // Update other user tab label
    var otherEmail = Object.keys(USER_NAMES).find(function(e) { return e !== ME; });
    var otherInfo  = otherEmail ? USER_NAMES[otherEmail] : {name: 'Colega', initials: 'CO'};

    document.getElementById('avatar-me').textContent    = uinfo.initials;
    document.getElementById('label-me').textContent     = ME_NAME;
    document.getElementById('avatar-other').textContent = otherInfo.initials;
    document.getElementById('label-other').textContent  = otherInfo.name;
    document.getElementById('tab-me').classList.add('active');
    document.getElementById('tab-other').classList.remove('active');
    document.getElementById('hdr-sub').textContent = 'O meu TO-DO';

    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';

    startListener(ME_UID);
  } else if (user) {
    await signOut(auth);
    document.getElementById('login-err').style.display = 'block';
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
  } else {
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
  }
});

// MODAL
window.openModal = function(id) {
  editId = id || null;
  var viewing = isViewingOther();
  var isNew = !id;
  var canFullEdit = !viewing;

  document.getElementById('mtitle').textContent = isNew ? 'Nova tarefa' : 'Editar tarefa';
  document.getElementById('modal-sub').textContent = viewing ? ('No board de ' + (USER_NAMES[VIEW_EMAIL] ? USER_NAMES[VIEW_EMAIL].name : VIEW_EMAIL)) : '';
  document.getElementById('readonly-notice').style.display = (viewing && !isNew) ? 'block' : 'none';
  document.getElementById('btn-del').style.display = (id && canFullEdit) ? 'block' : 'none';
  document.getElementById('btn-save').style.display = (canFullEdit || isNew) ? 'block' : 'none';

  var disabled = !canFullEdit && !isNew;
  ['f-title','f-cat','f-prio','f-date','f-status','f-obs'].forEach(function(fid) {
    document.getElementById(fid).disabled = disabled;
  });

  if (id && tasks[id]) {
    var t = tasks[id];
    document.getElementById('f-title').value  = t.title  || '';
    document.getElementById('f-cat').value    = t.cat    || 'Obra';
    document.getElementById('f-prio').value   = t.prio   || 'Normal';
    document.getElementById('f-date').value   = t.date   || '';
    document.getElementById('f-status').value = t.status || 'Em aberto';
    document.getElementById('f-obs').value    = t.obs    || '';
  } else {
    document.getElementById('f-title').value  = '';
    document.getElementById('f-cat').value    = 'Obra';
    document.getElementById('f-prio').value   = 'Normal';
    document.getElementById('f-date').value   = '';
    document.getElementById('f-status').value = 'Em aberto';
    document.getElementById('f-obs').value    = '';
  }
  document.getElementById('overlay').classList.add('open');
  setTimeout(function() { document.getElementById('f-title').focus(); }, 100);
};

window.closeModal  = function() { document.getElementById('overlay').classList.remove('open'); };

window.saveTask = async function() {
  var title = document.getElementById('f-title').value.trim();
  if (!title) { document.getElementById('f-title').focus(); return; }
  var task = {
    id:            editId || uid(),
    title:         title,
    cat:           document.getElementById('f-cat').value,
    prio:          document.getElementById('f-prio').value,
    date:          document.getElementById('f-date').value,
    status:        document.getElementById('f-status').value,
    obs:           document.getElementById('f-obs').value.trim(),
    createdBy:     ME,
    createdByName: ME_NAME
  };
  closeModal();
  tasks[task.id] = task;
  render();
  await saveToFirebase(task);
  toast(editId ? 'Tarefa atualizada' : 'Tarefa criada', 'ok');
};

window.deleteTask = async function() {
  if (!editId || isViewingOther()) return;
  if (!confirm('Apagar esta tarefa?')) return;
  var id = editId;
  closeModal();
  delete tasks[id];
  render();
  await deleteFromFirebase(id);
  toast('Tarefa apagada', '');
};

window.clearCanceladas = async function() {
  if (!confirm('Apagar todas as tarefas canceladas?')) return;
  var toDelete = Object.values(tasks).filter(function(t) { return t.status === 'Cancelada'; });
  if (toDelete.length === 0) return;
  setSyncDot('loading');
  try {
    var batch = writeBatch(db);
    toDelete.forEach(function(t) {
      delete tasks[t.id];
      batch.delete(doc(db, 'users', VIEW_UID, 'tasks', t.id));
    });
    await batch.commit();
    setSyncDot('ok');
    toast(toDelete.length + ' tarefas apagadas', 'ok');
    render();
  } catch(e) { setSyncDot('err'); toast('Erro ao limpar', 'err'); }
};

window.setPrio = function(v, btn) {
  pfilt = v;
  document.querySelectorAll('#filters .fbtn:not(.mobile-only)').forEach(function(b,i) { if(i<6) b.classList.remove('on'); });
  btn.classList.add('on'); render();
};
window.setCat = function(v, btn) {
  cfilt = v;
  document.querySelectorAll('#filters .fbtn:not(.mobile-only)').forEach(function(b,i) { if(i>=6) b.classList.remove('on'); });
  btn.classList.add('on'); render();
};
window.setStatus = function(v, btn) {
  sfilt = v;
  document.querySelectorAll('#filters .fbtn.mobile-only').forEach(function(b) { b.classList.remove('on'); });
  btn.classList.add('on'); render();
};

window.openEventModal = function() {
  var sel = document.getElementById('ev-task');
  sel.innerHTML = '<option value="">Sem tarefa ligada</option>';
  Object.values(tasks).filter(function(t) { return t.status !== 'Cancelada' && t.status !== 'Concluida'; })
    .sort(function(a,b) { return (PORD[a.prio]||9)-(PORD[b.prio]||9); })
    .forEach(function(t) {
      var opt = document.createElement('option');
      opt.value = t.id;
      opt.textContent = t.title.length > 50 ? t.title.slice(0,50) + '...' : t.title;
      sel.appendChild(opt);
    });
  document.getElementById('ev-date').value  = new Date().toISOString().split('T')[0];
  document.getElementById('ev-title').value = '';
  document.getElementById('ev-notes').value = '';
  document.getElementById('event-overlay').classList.add('open');
};
window.closeEventModal = function() { document.getElementById('event-overlay').classList.remove('open'); };

window.createGCalEvent = function() {
  var title = document.getElementById('ev-title').value.trim();
  var date  = document.getElementById('ev-date').value;
  if (!title || !date) { toast('Preenche o titulo e a data', 'err'); return; }
  var taskId = document.getElementById('ev-task').value;
  var notes  = document.getElementById('ev-notes').value.trim();
  var start  = document.getElementById('ev-start').value;
  var end    = document.getElementById('ev-end').value;
  var details = notes;
  if (taskId && tasks[taskId]) { details = (notes ? notes + ' | ' : '') + 'Tarefa: ' + tasks[taskId].title; }
  var fmt = function(d,t) { return d.replace(/-/g,'') + 'T' + t.replace(':','') + '00'; };
  var url = 'https://calendar.google.com/calendar/r/eventedit?text=' + encodeURIComponent(title) +
    '&dates=' + fmt(date,start) + '/' + fmt(date,end) +
    '&details=' + encodeURIComponent(details) + '&ctz=Europe/Lisbon';
  window.open(url, '_blank');
  closeEventModal();
  toast('A abrir Google Calendar...', 'ok');
};

document.getElementById('overlay').addEventListener('click', function(e) { if(e.target===e.currentTarget) closeModal(); });
document.getElementById('event-overlay').addEventListener('click', function(e) { if(e.target===e.currentTarget) closeEventModal(); });
document.addEventListener('keydown', function(e) { if(e.key==='Escape'){closeModal();closeEventModal();} });
})();
</script>
